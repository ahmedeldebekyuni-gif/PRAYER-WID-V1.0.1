name: Build PrayerWidgets APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project
        id: loc
        run: |
          f=$(find . -name settings.gradle -o -name settings.gradle.kts | grep -v node_modules | head -n1)
          [ -z "$f" ] && { echo "No settings.gradle found"; exit 1; }
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          ls -la "$(dirname "$f")"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PrayerWidgets-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
